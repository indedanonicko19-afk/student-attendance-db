<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Student Event Attendance</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            min-height: 100vh;
            background: #090e1a;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background Orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            z-index: 0;
            animation: floatOrb 9s ease-in-out infinite alternate;
        }
        .orb-1 { width: 340px; height: 340px; background: #0284c7; top: -80px; left: -80px; }
        .orb-2 { width: 320px; height: 320px; background: #6366f1; bottom: -90px; right: -60px; animation-delay: -4s; }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(35px, 28px) scale(1.12); }
        }

        @keyframes cardSlideIn {
            0% { opacity: 0; transform: translateY(28px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes fadeSwap {
            0% { opacity: 0; transform: translateX(10px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 430px;
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(56, 189, 248, 0.22);
            border-radius: 18px;
            padding: 34px 30px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55);
            animation: cardSlideIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
            color: #fff;
            box-shadow: 0 8px 20px rgba(14, 165, 233, 0.35);
        }
        h1 { font-size: 21px; font-weight: 700; color: #f8fafc; }
        .subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 22px; }

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            background: #0f172a;
            border: 1px solid #1e293b;
            padding: 5px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .tab-btn {
            border: none;
            background: transparent;
            padding: 9px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
        }

        .alert {
            padding: 10px 13px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
            animation: fadeSwap 0.3s ease;
        }
        .alert-error { background: rgba(239, 68, 68, 0.14); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.35); }
        .alert-success { background: rgba(34, 197, 94, 0.14); color: #86efac; border: 1px solid rgba(34, 197, 94, 0.35); }

        .form-panel { animation: fadeSwap 0.3s ease; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: #cbd5e1; letter-spacing: 0.3px; }
        .input-wrap { position: relative; }
        input {
            width: 100%;
            padding: 11px 13px;
            background: #0b1220;
            color: #f8fafc;
            border: 1px solid #334155;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
        }
        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
        }
        .toggle-pass {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 6px;
        }
        .toggle-pass:hover { color: #38bdf8; }

        .btn-primary {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            transition: transform 0.18s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 22px rgba(37, 99, 235, 0.35);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 26px rgba(14, 165, 233, 0.45);
        }
        .btn-primary:active { transform: translateY(0); }

        .hidden { display: none; }
        .hint { margin-top: 16px; font-size: 12px; color: #64748b; text-align: center; }
        .hint strong { color: #38bdf8; }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="card">
        <div class="brand">
            <div class="brand-icon">SA</div>
            <div>
                <h1>Admin Portal</h1>
                <p style="font-size:12px; color:#38bdf8;">Student Event Attendance</p>
            </div>
        </div>
        <p class="subtitle">Sign in before accessing attendance records and check-ins.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="tabs">
            <button type="button" class="tab-btn active" id="tab-login" onclick="showTab('login')">Sign In</button>
            <button type="button" class="tab-btn" id="tab-register" onclick="showTab('register')">Create Account</button>
        </div>

        <form id="login-form" class="form-panel" action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label for="login-user">Username</label>
                <input type="text" id="login-user" name="username" placeholder="Enter username" required autofocus>
            </div>
            <div class="form-group">
                <label for="login-pass">Password</label>
                <div class="input-wrap">
                    <input type="password" id="login-pass" name="password" placeholder="Enter password" required>
                    <button type="button" class="toggle-pass" onclick="togglePass('login-pass', this)">Show</button>
                </div>
            </div>
            <button type="submit" class="btn-primary">Sign In to Dashboard</button>
        </form>

        <form id="register-form" class="form-panel hidden" action="{{ url_for('register') }}" method="POST">
            <div class="form-group">
                <label for="reg-user">New Username</label>
                <input type="text" id="reg-user" name="username" placeholder="Choose username" required>
            </div>
            <div class="form-group">
                <label for="reg-pass">Password</label>
                <div class="input-wrap">
                    <input type="password" id="reg-pass" name="password" placeholder="Create password" required>
                    <button type="button" class="toggle-pass" onclick="togglePass('reg-pass', this)">Show</button>
                </div>
            </div>
            <div class="form-group">
                <label for="reg-confirm">Confirm Password</label>
                <input type="password" id="reg-confirm" name="confirm" placeholder="Confirm password" required>
            </div>
            <button type="submit" class="btn-primary">Create Admin Account</button>
        </form>
    </div>

    <script>
        function showTab(tab) {
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            const tabLogin = document.getElementById('tab-login');
            const tabReg = document.getElementById('tab-register');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                tabLogin.classList.add('active');
                tabReg.classList.remove('active');
            } else {
                regForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                tabReg.classList.add('active');
                tabLogin.classList.remove('active');
            }
        }

        function togglePass(id, btn) {
            const input = document.getElementById(id);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = 'Hide';
            } else {
                input.type = 'password';
                btn.textContent = 'Show';
            }
        }
    </script>
</body>
</html>
